name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: [self-hosted, orange-pi]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Sync local clone
        run: |
          set -e
          echo "Syncing local claude-canvas clone..."
          echo "Commit: ${{ steps.commit.outputs.sha_short }}"

          REPO_DIR="/home/orangepi/claude-canvas"

          if [ ! -d "$REPO_DIR" ]; then
            echo "::error::Repository directory not found: $REPO_DIR"
            exit 1
          fi

          cd "$REPO_DIR"

          if ! git remote get-url origin > /dev/null 2>&1; then
            echo "::error::Git remote 'origin' not configured"
            exit 1
          fi

          git fetch origin main
          git reset --hard origin/main

          CURRENT_SHA=$(git rev-parse --short HEAD)
          echo "Local clone synced to $CURRENT_SHA"

      - name: Deployment summary
        run: |
          echo ""
          echo "=================================================="
          echo "CLAUDE-CANVAS DEPLOYMENT COMPLETE"
          echo "=================================================="
          echo "Commit: ${{ steps.commit.outputs.sha_short }}"
          echo "Message: ${{ steps.commit.outputs.message }}"
          echo "Local path: /home/orangepi/claude-canvas"
          echo "=================================================="
