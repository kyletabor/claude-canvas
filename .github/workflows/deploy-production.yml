name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: [self-hosted, orange-pi]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get commit info
        id: commit
        run: |
          set -e
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Sync local clone
        run: |
          set -e
          echo "Syncing local claude-canvas clone..."
          echo "Commit: ${{ steps.commit.outputs.sha_short }}"

          REPO_DIR="/home/orangepi/claude-canvas"

          if [ ! -d "$REPO_DIR" ]; then
            echo "::error::Repository directory not found: $REPO_DIR"
            exit 1
          fi

          cd "$REPO_DIR"

          if ! git remote get-url origin > /dev/null 2>&1; then
            echo "::error::Git remote 'origin' not configured"
            exit 1
          fi

          git fetch origin main
          git reset --hard origin/main

          CURRENT_SHA=$(git rev-parse --short HEAD)
          echo "Local clone synced to $CURRENT_SHA"

      - name: Install dependencies
        run: |
          set -e
          echo "Installing canvas dependencies..."
          cd /home/orangepi/claude-canvas/canvas
          bun install

          # Verify critical deps installed
          if [ ! -d node_modules/react ]; then
            echo "ERROR: react not installed"
            exit 1
          fi
          echo "Dependencies installed successfully"

      - name: Verify plugin symlink
        run: |
          set -e
          SYMLINK_PATH="/home/orangepi/.claude/plugins/cache/claude-canvas/canvas/0.1.0"
          TARGET_PATH="/home/orangepi/claude-canvas/canvas"

          # Create parent dirs if missing
          mkdir -p "$(dirname $SYMLINK_PATH)"

          # Check if symlink exists and points to correct target
          if [ -L "$SYMLINK_PATH" ]; then
            CURRENT_TARGET=$(readlink -f "$SYMLINK_PATH")
            if [ "$CURRENT_TARGET" = "$TARGET_PATH" ]; then
              echo "Symlink valid: $SYMLINK_PATH -> $TARGET_PATH"
            else
              echo "Symlink points to wrong target, fixing..."
              rm "$SYMLINK_PATH"
              ln -s "$TARGET_PATH" "$SYMLINK_PATH"
            fi
          elif [ -d "$SYMLINK_PATH" ]; then
            echo "Cache is a directory (not symlink), replacing with symlink..."
            rm -rf "$SYMLINK_PATH"
            ln -s "$TARGET_PATH" "$SYMLINK_PATH"
          else
            echo "Creating symlink..."
            ln -s "$TARGET_PATH" "$SYMLINK_PATH"
          fi

          # Final verification
          if [ ! -f "$SYMLINK_PATH/src/cli.ts" ]; then
            echo "ERROR: Symlink verification failed - cli.ts not accessible"
            exit 1
          fi
          echo "Plugin symlink verified successfully"

      - name: Deployment summary
        run: |
          echo ""
          echo "=================================================="
          echo "CLAUDE-CANVAS DEPLOYMENT COMPLETE"
          echo "=================================================="
          echo "Commit: ${{ steps.commit.outputs.sha_short }}"
          echo "Message: ${{ steps.commit.outputs.message }}"
          echo "Local path: /home/orangepi/claude-canvas"
          echo "=================================================="
